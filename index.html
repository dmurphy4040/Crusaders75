<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crusaders 75</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, rgba(2, 44, 67, 0.72) 0%, rgba(42, 98, 143, 0.72) 45%, rgba(27, 59, 110, 0.72) 100%),
                  url("ClassPic5.jpeg");
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center center;
      background-blend-mode: overlay;
      color: #f2f7fb;
      display: flex;
      align-items: top;
      justify-content: left;
      padding: 32px;
    }

    .container {
      width: min(100%);
      height: min(100px, 100%);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 24px;
      box-shadow: 0 22px 80px rgba(0, 0, 0, 0.24);
      backdrop-filter: blur(16px);
      padding: 32px;
    }

    h1 {
      margin-top: 0;
      font-size: clamp(2rem, 3vw, 3rem);
      letter-spacing: 0.04em;
    }

    p {
      margin: 0 0 24px;
      line-height: 1.7;
      color: #e8eef4;
    }

    .link-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 14px;
    }

    .link-list a {
      display: inline;
      padding: 3px 15px;
      border-radius: 24px;
      text-decoration: none;
      color: #000000;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }

    .link-list a:hover,
    .link-list a:focus-visible {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.16);
      box-shadow: 0 14px 24px rgba(0, 0, 0, 0.18);
    }

    .hint {
      margin-top: 24px;
      font-size: 0.95rem;
      color: #c7d4e4;
    }
  </style>
</head>
<body>
  <div class="container">
     <ul class="link-list">

        <a href="images/photo2.jpeg">Photo 2</a>&nbsp;
        <a href="images/photo2.jpeg">Photo 2</a>&nbsp;
        <a href="images/photo2.jpeg">Photo 2</a>&nbsp;
      </li>
      <li>
        <a href="images/photo1.jpeg">Photo 1</a>&nbsp;
        <a href="images/photo2.jpeg">Photo 2</a>&nbsp;
        <a href="images/photo2.jpeg">Photo 2</a>&nbsp;
        <a href="images/photo2.jpeg">Photo 2</a>&nbsp;
        <a href="images/photo2.jpeg">Photo 2</a>&nbsp;
      </li>
    </ul>
  </div>
</body>
</html>
